name: Source Quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          find . -type f -name '*.php' -not -path './storage/*' -print0 |
            xargs -0 -n1 php -l

      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -print0)

      - name: Reject private and generated files
        shell: bash
        run: |
          forbidden='(^|/)(storage/(data|runtime-data)\.php|uploads?/|backups?/|logs?/|cache/)|\.(env|sql|sqlite3?|db|csv|xlsx?|zip|bak)$'
          matches="$(git ls-files | grep -Ei "$forbidden" || true)"
          if [ -n "$matches" ]; then
            echo "Forbidden tracked files:"
            echo "$matches"
            exit 1
          fi
